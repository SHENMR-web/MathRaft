<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">MathRaft</title>
  <desc id="description">You steer the research. Agents explore together. 研究由你掌舵，探索协同推进。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#c4d8ff"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#background)"/>
  <rect x="780" y="24" width="476" height="312" rx="16" fill="url(#dots)"/>
  <g font-family="Segoe UI, Arial, Microsoft YaHei, sans-serif">
