      <rect x="1160" y="162" width="37" height="35" rx="10"/>
      <rect x="1160" y="205" width="37" height="35" rx="10"/>
    </g>
    <g fill="none" stroke="#348c7c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1170 136L1176 142L1187 131"/>
      <path d="M1170 179L1176 185L1187 174"/>
      <path d="M1170 222L1176 228L1187 217"/>
