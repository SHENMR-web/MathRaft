    <text x="60" y="132" fill="#12335b" font-size="66" font-weight="700" letter-spacing="-2">MathRaft</text>
    <text x="64" y="187" fill="#183b65" font-size="30" font-weight="600">You steer the research.</text>
    <text x="64" y="227" fill="#183b65" font-size="30" font-weight="600">Agents explore together.</text>
    <text x="64" y="272" fill="#527197" font-size="22">研究由你掌舵，探索协同推进。</text>
    <text x="64" y="320" fill="#2563eb" font-size="13" letter-spacing="1.3">LITERATURE → RESEARCH PATHS → THEORY &amp; PROOFS</text>
    <g fill="none" stroke="#9bbdf5" stroke-width="2.5">
      <path d="M844 180H920M920 94V266M920 94H984M920 180H984M920 266H984"/>
      <path d="M1046 94H1110V137H1178M1046 180H1178M1046 266H1110V223H1178"/>
    </g>
    <circle cx="838" cy="180" r="21" fill="#2563eb"/>
    <path d="M831 180H845M838 173V187" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="white" stroke="#b0cbf8" stroke-width="1.5">
      <rect x="978" y="69" width="76" height="50" rx="12"/>
      <rect x="978" y="155" width="76" height="50" rx="12"/>
      <rect x="978" y="241" width="76" height="50" rx="12"/>
    </g>
    <g fill="#2563eb" font-size="16" text-anchor="middle" font-weight="600">
